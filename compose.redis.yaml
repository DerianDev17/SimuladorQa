services:
  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '32mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    restart: 'no'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 2s
      retries: 3
